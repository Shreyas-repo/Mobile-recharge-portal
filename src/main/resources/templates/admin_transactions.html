<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Ledger | PayPulse MRP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --surface: #131b2e;
            --surface-card: #1c2640;
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --text-main: #f8fafc;
            --border-subtle: #2d3748;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        .navbar-custom {
            background: rgba(19, 27, 46, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .table-custom {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            overflow: hidden;
        }

        .table-custom table {
            margin-bottom: 0;
            color: var(--text-main);
        }

        .table-custom th {
            background: #192238;
            border-bottom: 1px solid var(--border-subtle);
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 14px 18px;
        }

        .table-custom td {
            padding: 16px 18px;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-subtle);
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 50px;
            font-weight: 600;
        }

        .status-SUCCESS {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .status-PENDING {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid #f59e0b;
        }

        .status-FAILED {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .search-input {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            color: white;
            border-radius: 10px;
            padding: 10px 16px;
        }

        .search-input:focus {
            background: var(--surface);
            border-color: var(--accent-primary);
            color: white;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
            <i class="fa-solid fa-tower-cell text-primary fs-4"></i>
            <span>PayPulse <span class="badge bg-primary fs-7">MRP</span></span>
        </a>
        <div class="collapse navbar-collapse show" id="navContent">
            <ul class="navbar-nav ms-auto align-items-center gap-3">
                <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house me-1"></i> Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/transactions"><i class="fa-solid fa-list-check me-1"></i> Ledger</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="fa-solid fa-chart-pie me-1"></i> Dashboard</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <!-- Alerts -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-4" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-4" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
            <h2 class="fw-bold mb-1">Transaction Audit Ledger</h2>
            <p class="text-secondary small mb-0">Live audit log, real-time search, and administrative status workflow management</p>
        </div>
        <div class="d-flex gap-2">
            <form action="/admin/transactions" method="GET" class="d-flex gap-2">
                <input type="text" name="search" id="ledger-search" class="form-control search-input"
                       placeholder="Search Mobile / Ref / Status..." th:value="${searchQuery}">
                <button type="submit" id="btn-search" class="btn btn-primary rounded-3 px-3">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <a href="/admin/transactions" class="btn btn-outline-secondary rounded-3 px-3" title="Reset Search">
                    <i class="fa-solid fa-rotate-left"></i>
                </a>
            </form>
        </div>
    </div>

    <!-- Ledger Table -->
    <div class="table-custom">
        <div class="table-responsive">
            <table class="table align-middle" id="transactions-table">
                <thead>
                <tr>
                    <th>Ref ID</th>
                    <th>Mobile Number</th>
                    <th>Operator</th>
                    <th>Plan Details</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Timestamp</th>
                    <th class="text-end">Workflow Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="txn : ${transactions}">
                    <td>
                        <a th:href="@{'/receipt/' + ${txn.txnReference}}" class="fw-bold font-monospace text-primary text-decoration-none" th:text="${txn.txnReference}"></a>
                    </td>
                    <td>
                        <span class="fw-semibold" th:text="${txn.mobileNumber}"></span>
                    </td>
                    <td>
                        <span class="badge bg-secondary-subtle text-light" th:text="${txn.operator}"></span>
                    </td>
                    <td>
                        <span class="small" th:text="${txn.planName}"></span>
                    </td>
                    <td>
                        <span class="fw-bold text-success">₹<span th:text="${#numbers.formatDecimal(txn.amount, 0, 2)}"></span></span>
                    </td>
                    <td>
                        <span class="status-badge" th:classappend="'status-' + ${txn.status}" th:text="${txn.status}"></span>
                    </td>
                    <td>
                        <span class="text-secondary small" th:text="${#temporals.format(txn.createdAt, 'dd-MM-yyyy HH:mm')}"></span>
                    </td>
                    <td class="text-end">
                        <div class="dropdown d-inline-block">
                            <button class="btn btn-sm btn-outline-light dropdown-toggle rounded-pill px-3" type="button" data-bs-toggle="dropdown">
                                Change Status
                            </button>
                            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow">
                                <li>
                                    <form th:action="@{'/admin/transactions/' + ${txn.id} + '/status'}" method="POST">
                                        <input type="hidden" name="status" value="SUCCESS">
                                        <button type="submit" class="dropdown-item text-success"><i class="fa-solid fa-check me-2"></i> Mark Success</button>
                                    </form>
                                </li>
                                <li>
                                    <form th:action="@{'/admin/transactions/' + ${txn.id} + '/status'}" method="POST">
                                        <input type="hidden" name="status" value="PENDING">
                                        <button type="submit" class="dropdown-item text-warning"><i class="fa-solid fa-clock me-2"></i> Mark Pending</button>
                                    </form>
                                </li>
                                <li>
                                    <form th:action="@{'/admin/transactions/' + ${txn.id} + '/status'}" method="POST">
                                        <input type="hidden" name="status" value="FAILED">
                                        <button type="submit" class="dropdown-item text-danger"><i class="fa-solid fa-xmark me-2"></i> Mark Failed</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="8" class="text-center py-5 text-secondary">
                        <i class="fa-solid fa-box-open fs-2 mb-2 d-block"></i>
                        No transactions found matching the filter criteria.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
