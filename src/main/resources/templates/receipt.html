<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Receipt | PayPulse MRP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --surface: #131b2e;
            --surface-card: #1c2640;
            --text-main: #f8fafc;
            --border-subtle: #2d3748;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        .receipt-card {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            margin: auto;
        }

        .status-badge {
            font-size: 0.95rem;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 600;
        }

        .status-SUCCESS {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .status-PENDING {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid #f59e0b;
        }

        .status-FAILED {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .receipt-divider {
            border-top: 2px dashed var(--border-subtle);
            margin: 24px 0;
        }

        @media print {
            body {
                background: white;
                color: black;
            }
            .no-print {
                display: none;
            }
            .receipt-card {
                border: 1px solid #ccc;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="receipt-card p-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-primary-subtle text-primary mb-3">
                <i class="fa-solid fa-circle-check fs-1"></i>
            </div>
            <h2 class="fw-bold mb-1">Recharge Confirmation</h2>
            <p class="text-secondary small">Thank you for your transaction. Here is your digital receipt.</p>
            <div class="mt-2">
                <span class="status-badge" th:classappend="'status-' + ${txn.status}" id="receipt-status" th:text="${txn.status}"></span>
            </div>
        </div>

        <div class="receipt-divider"></div>

        <div class="d-flex justify-content-between mb-3">
            <span class="text-secondary">Transaction Ref</span>
            <span class="fw-bold font-monospace text-primary" id="receipt-ref" th:text="${txn.txnReference}"></span>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <span class="text-secondary">Mobile Number</span>
            <span class="fw-semibold" id="receipt-mobile" th:text="'+91 ' + ${txn.mobileNumber}"></span>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <span class="text-secondary">Operator</span>
            <span class="fw-semibold badge bg-secondary-subtle text-light" th:text="${txn.operator}"></span>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <span class="text-secondary">Plan Selected</span>
            <span class="fw-semibold text-end" th:text="${txn.planName}"></span>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <span class="text-secondary">Date & Time</span>
            <span class="fw-semibold small" th:text="${#temporals.format(txn.createdAt, 'dd MMM yyyy, HH:mm:ss')}"></span>
        </div>

        <div class="receipt-divider"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <span class="fs-5 fw-bold">Amount Paid</span>
            <span class="display-6 fw-bold text-success" id="receipt-amount">₹<span th:text="${#numbers.formatDecimal(txn.amount, 0, 2)}"></span></span>
        </div>

        <div class="d-flex flex-wrap gap-2 no-print">
            <button onclick="window.print()" class="btn btn-outline-light flex-grow-1 py-2 rounded-3">
                <i class="fa-solid fa-print me-1"></i> Print Receipt
            </button>
            <a href="/" class="btn btn-primary flex-grow-1 py-2 rounded-3" id="btn-another-recharge">
                <i class="fa-solid fa-rotate-right me-1"></i> Make Another
            </a>
            <a href="/admin/transactions" class="btn btn-outline-secondary py-2 rounded-3">
                <i class="fa-solid fa-list me-1"></i> Ledger
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
