version: '3.8'

services:
  mrp-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops/mobile-recharge-portal:latest
    container_name: mobile-recharge-portal
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
